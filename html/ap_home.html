<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OpenSprinkler — Wi‑Fi Setup</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <style>
    :root {
      --ink: #0c2e2a;
      --muted: #4a6b66;
      --paper: #f3f7f4;
      --panel: rgba(255, 255, 255, 0.82);
      --line: rgba(12, 46, 42, 0.12);
      --accent: #1a7a62;
      --accent-2: #0e5c4a;
      --good: #157a45;
      --warn: #9a6b12;
      --bad: #b42318;
      --glow: rgba(26, 122, 98, 0.22);
      --shadow: 0 18px 50px rgba(8, 40, 34, 0.14);
      --radius: 18px;
      --font: "Avenir Next", "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #e8f3ef;
        --muted: #9bb5af;
        --paper: #071714;
        --panel: rgba(14, 36, 32, 0.88);
        --line: rgba(232, 243, 239, 0.12);
        --accent: #3dba96;
        --accent-2: #2a9a7a;
        --good: #4ade80;
        --warn: #fbbf24;
        --bad: #f87171;
        --glow: rgba(61, 186, 150, 0.18);
        --shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
      }
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      font-family: var(--font);
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(45, 160, 130, 0.28), transparent 55%),
        radial-gradient(900px 500px at 100% 0%, rgba(20, 90, 120, 0.18), transparent 50%),
        linear-gradient(165deg, #e8f2ed 0%, var(--paper) 45%, #dfece6 100%);
      background-attachment: fixed;
      padding: max(20px, env(safe-area-inset-top)) 18px max(28px, env(safe-area-inset-bottom));
      -webkit-font-smoothing: antialiased;
    }
    @media (prefers-color-scheme: dark) {
      body {
        background:
          radial-gradient(1000px 520px at 0% -10%, rgba(45, 160, 130, 0.2), transparent 55%),
          radial-gradient(800px 480px at 100% 10%, rgba(20, 90, 120, 0.16), transparent 50%),
          linear-gradient(165deg, #061512 0%, var(--paper) 50%, #0a1c18 100%);
      }
    }
    .shell {
      width: min(560px, 100%);
      margin: 0 auto;
      animation: rise 0.55s ease-out both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: none; }
    }
    .brand {
      text-align: center;
      margin-bottom: 22px;
    }
    .mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: linear-gradient(145deg, var(--accent), var(--accent-2));
      color: #fff;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.04em;
      box-shadow: 0 10px 24px var(--glow);
      margin-bottom: 14px;
      animation: pulse 2.8s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }
    .brand h1 {
      margin: 0;
      font-size: clamp(1.55rem, 4.5vw, 1.9rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.15;
    }
    .brand p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 0.98rem;
      line-height: 1.45;
    }
    .panel {
      background: var(--panel);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 22px 20px 24px;
    }
    .section-label {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }
    .section-label h2 {
      margin: 0;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .hint {
      font-size: 0.8rem;
      color: var(--muted);
    }
    .networks {
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 22px;
      max-height: 280px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    #rd {
      width: 100%;
      border-collapse: collapse;
    }
    #rd th {
      position: sticky;
      top: 0;
      z-index: 1;
      text-align: left;
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      background: color-mix(in srgb, var(--panel) 92%, var(--accent));
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
    }
    #rd td {
      padding: 12px;
      border-bottom: 1px solid var(--line);
      vertical-align: middle;
      font-size: 0.92rem;
    }
    #rd tr:last-child td { border-bottom: none; }
    #rd tbody tr {
      cursor: pointer;
      transition: background 0.18s ease;
    }
    #rd tbody tr:hover,
    #rd tbody tr:focus-within {
      background: color-mix(in srgb, var(--accent) 10%, transparent);
    }
    #rd tbody tr.selected {
      background: color-mix(in srgb, var(--accent) 16%, transparent);
    }
    .ssid-cell {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      min-width: 0;
    }
    .ssid-cell input {
      accent-color: var(--accent);
      width: 18px;
      height: 18px;
      flex: none;
    }
    .ssid-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .meta {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      font-size: 0.85rem;
    }
    .bars {
      display: inline-flex;
      align-items: flex-end;
      gap: 2px;
      height: 14px;
      margin-right: 6px;
      vertical-align: middle;
    }
    .bars i {
      display: block;
      width: 3px;
      border-radius: 1px;
      background: color-mix(in srgb, var(--muted) 45%, transparent);
    }
    .bars i:nth-child(1) { height: 4px; }
    .bars i:nth-child(2) { height: 7px; }
    .bars i:nth-child(3) { height: 10px; }
    .bars i:nth-child(4) { height: 14px; }
    .bars.ok i { background: var(--good); }
    .bars.ok i:nth-child(n+1) { opacity: 1; }
    .bars.weak i:nth-child(-n+2) { background: var(--warn); }
    .bars.weak i:nth-child(n+3) { opacity: 0.25; }
    .bars.poor i:nth-child(1) { background: var(--bad); }
    .bars.poor i:nth-child(n+2) { opacity: 0.22; }
    .scanning {
      text-align: center;
      color: var(--muted);
      padding: 28px 12px !important;
    }
    .scanning::after {
      content: "";
      display: inline-block;
      width: 0.9em;
      animation: dots 1.2s steps(4, end) infinite;
    }
    @keyframes dots {
      0% { content: ""; }
      25% { content: "."; }
      50% { content: ".."; }
      75% { content: "..."; }
    }
    .form-group { margin-bottom: 14px; }
    label {
      display: block;
      font-weight: 650;
      font-size: 0.9rem;
      margin-bottom: 6px;
    }
    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      font: inherit;
      font-size: 16px;
      color: inherit;
      background: color-mix(in srgb, var(--panel) 70%, transparent);
      border: 1px solid var(--line);
      border-radius: 12px;
      transition: border-color 0.18s, box-shadow 0.18s;
    }
    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--glow);
    }
    details.advanced {
      margin: 6px 0 16px;
      border-top: 1px solid var(--line);
      padding-top: 10px;
    }
    details.advanced summary {
      cursor: pointer;
      color: var(--muted);
      font-size: 0.88rem;
      font-weight: 650;
      list-style: none;
    }
    details.advanced summary::-webkit-details-marker { display: none; }
    details.advanced[open] summary { margin-bottom: 12px; }
    #msg {
      min-height: 1.25em;
      margin: 4px 0 16px;
      font-weight: 650;
      font-size: 0.95rem;
      line-height: 1.45;
    }
    #msg .ok { color: var(--good); }
    #msg .err { color: var(--bad); }
    #msg .wait { color: var(--muted); }
    button#butt {
      width: 100%;
      padding: 14px 16px;
      border: 0;
      border-radius: 14px;
      font: inherit;
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(145deg, var(--accent), var(--accent-2));
      box-shadow: 0 10px 22px var(--glow);
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.15s ease, opacity 0.15s;
    }
    button#butt:hover:not(:disabled) { filter: brightness(1.05); }
    button#butt:active:not(:disabled) { transform: translateY(1px) scale(0.99); }
    button#butt:disabled { opacity: 0.55; cursor: not-allowed; box-shadow: none; }
    @media (max-width: 420px) {
      #rd th:nth-child(2), #rd td:nth-child(2),
      #rd th:nth-child(4), #rd td:nth-child(4) { display: none; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="brand">
      <div class="mark" aria-hidden="true">OS</div>
      <h1>OpenSprinkler</h1>
      <p>Connect this controller to your Wi‑Fi network.</p>
    </header>

    <main class="panel">
      <div class="section-label">
        <h2>Networks</h2>
        <span class="hint">Tap a network to select</span>
      </div>
      <div class="networks">
        <table id="rd">
          <thead>
            <tr>
              <th>SSID</th>
              <th>BSSID</th>
              <th>Signal</th>
              <th>Ch</th>
            </tr>
          </thead>
          <tbody>
            <tr><td class="scanning" colspan="4">Scanning</td></tr>
          </tbody>
        </table>
      </div>

      <div id="div_input">
        <div class="form-group">
          <label for="ssid">SSID</label>
          <input type="text" id="ssid" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">
        </div>
        <div class="form-group">
          <label for="pass">Password</label>
          <input type="password" id="pass" autocomplete="current-password">
        </div>
        <details class="advanced">
          <summary>Advanced (BSSID / channel)</summary>
          <div class="form-group">
            <label for="bssid">BSSID</label>
            <input type="text" id="bssid" placeholder="Optional">
          </div>
          <div class="form-group">
            <label for="channel">Channel</label>
            <input type="text" id="channel" placeholder="Optional" inputmode="numeric">
          </div>
        </details>
      </div>

      <p id="msg" role="status" aria-live="polite"></p>
      <button type="button" id="butt" onclick="sf()">Connect</button>
    </main>
  </div>

<script>
function id(s) { return document.getElementById(s); }
function sel(i) {
  id('ssid').value = ssids[i][0];
  id('bssid').value = '';
  id('channel').value = '';
  var rows = document.querySelectorAll('#rd tbody tr');
  for (var r = 0; r < rows.length; r++) rows[r].classList.toggle('selected', r === i);
}
function signalClass(dbm) {
  if (dbm > -71) return 'ok';
  if (dbm > -81) return 'weak';
  return 'poor';
}
function signalLabel(dbm) {
  if (dbm > -71) return 'Strong';
  if (dbm > -81) return 'Fair';
  return 'Weak';
}
function barsHtml(dbm) {
  return "<span class='bars " + signalClass(dbm) + "' aria-hidden='true'><i></i><i></i><i></i><i></i></span>";
}
var tci, ssids;
var scanTries = 0;
function tryConnect() {
  var xhr = new XMLHttpRequest();
  xhr.onreadystatechange = function() {
    if (xhr.readyState == 4 && xhr.status == 200) {
      var jd = JSON.parse(xhr.responseText);
      if (jd.ip == 0) return;
      var ip = '' + (jd.ip % 256) + '.' + ((jd.ip / 256 >> 0) % 256) + '.' + (((jd.ip / 256 >> 0) / 256 >> 0) % 256) + '.' + ((((jd.ip / 256 >> 0) / 256 >> 0) / 256 >> 0));
      id('msg').innerHTML = "<span class='ok'>Connected — device IP " + ip + "</span><br><span class='wait'>Rebooting. Rejoin your Wi‑Fi, then open the device.</span>";
      id('butt').innerHTML = 'Open ' + ip;
      id('butt').disabled = false;
      id('butt').onclick = function() { window.open('http://' + ip); };
      clearInterval(tci);
    }
  };
  xhr.open('GET', 'jtap', true); xhr.send();
}
function sf() {
  id('msg').innerHTML = '';
  if (id('ssid').value.length == 0) { alert('SSID is empty!'); return; }
  var xhr = new XMLHttpRequest();
  xhr.onreadystatechange = function() {
    if (xhr.readyState == 4 && xhr.status == 200) {
      var jd = JSON.parse(xhr.responseText);
      if (jd.result == 1) {
        id('butt').innerHTML = 'Connecting…';
        id('msg').innerHTML = "<span class='wait'>Connecting — please wait…</span>";
        tci = setInterval(tryConnect, 1000);
        return;
      }
      id('msg').innerHTML = "<span class='err'>Error code " + jd.result + (jd.item !== undefined ? ', item ' + jd.item : '') + "</span>";
      id('butt').innerHTML = 'Connect';
      var inputs = document.querySelectorAll('#div_input input');
      for (var i = 0; i < inputs.length; i++) { inputs[i].disabled = false; }
      id('butt').disabled = false;
    }
  };
  var comm = 'ccap?ssid=' + encodeURIComponent(id('ssid').value) + '&pass=' + encodeURIComponent(id('pass').value);
  if (id('bssid').value.length > 0) {
    if (id('channel').value.length > 0) comm += '&extra=' + encodeURIComponent(id('bssid').value + '@' + id('channel').value);
    else comm += '&extra=' + encodeURIComponent(id('bssid').value + '@0');
  }
  xhr.open('POST', comm, true); xhr.send();
  var inputs = document.querySelectorAll('#div_input input');
  for (var i = 0; i < inputs.length; i++) { inputs[i].disabled = true; }
  id('butt').disabled = true;
}
function truncateStr(s, n) { if (s.length <= n) return s; return s.slice(0, n) + '…'; }
function loadSSIDs() {
  var xhr = new XMLHttpRequest();
  xhr.onreadystatechange = function() {
    if (xhr.readyState == 4 && xhr.status == 200) {
      var jd = JSON.parse(xhr.responseText), i;
      if (!Array.isArray(jd.scanned)) {
        scanTries++;
        if (scanTries < 20) { setTimeout(loadSSIDs, 1000); }
        return;
      }
      ssids = jd.scanned;
      if (!ssids || ssids.length === 0) {
        scanTries++;
        if (scanTries < 20) { setTimeout(loadSSIDs, 1000); }
        else {
          document.querySelector('#rd tbody').innerHTML = "<tr><td class='scanning' colspan='4'>No networks found</td></tr>";
        }
        return;
      }
      scanTries = 0;
      ssids.sort(function(a, b) { return b[2] - a[2]; });
      var tableBody = document.querySelector('#rd tbody');
      tableBody.innerHTML = '';
      for (i = 0; i < ssids.length; i++) {
        var row = tableBody.insertRow(-1);
        row.onclick = (function(idx) { return function() { document.querySelectorAll('input[name=ssids]')[idx].checked = true; sel(idx); }; })(i);
        var cell1 = row.insertCell(0);
        var cell2 = row.insertCell(1);
        var cell3 = row.insertCell(2);
        var cell4 = row.insertCell(3);
        cell1.innerHTML = "<label class='ssid-cell'><input name='ssids' onclick='event.stopPropagation();sel(" + i + ")' type='radio'><span class='ssid-name'>" + truncateStr(ssids[i][0], 22) + "</span></label>";
        cell2.className = 'meta';
        cell2.textContent = ssids[i][1];
        cell3.className = 'meta';
        cell3.innerHTML = barsHtml(ssids[i][2]) + ssids[i][2] + ' dBm · ' + signalLabel(ssids[i][2]);
        cell4.className = 'meta';
        cell4.textContent = ssids[i][3];
      }
    }
  };
  xhr.open('GET', 'jsap', true); xhr.send();
}
setTimeout(loadSSIDs, 1000);
</script>
</body>
</html>
